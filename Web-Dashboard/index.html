<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Box | GCS</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        },
                        brand: {
                            500: '#ef4444', // Red to match BGI hackathon theme
                            600: '#dc2626',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js for Infographics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        
        /* Blinking Red Dot for Live Status */
        .live-dot {
            animation: blinker 1.5s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans h-screen overflow-hidden flex flex-col">

    <!-- Top Navigation Bar -->
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-4">
            <svg class="w-8 h-8 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            <h1 class="text-xl font-bold tracking-wider">BLACK BOX <span class="text-gray-400 font-medium">| GCS</span></h1>
        </div>
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-green-500 rounded-full live-dot"></div>
                <span class="text-sm font-semibold text-green-400" id="connectionStatus">Telemetry: Connected</span>
            </div>
            <div class="text-sm text-gray-400" id="clock">00:00:00</div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 flex gap-4 overflow-hidden">
        
        <!-- Left Panel: Controls & Vital Stats -->
        <div class="w-1/4 flex flex-col gap-4 overflow-y-auto pr-2">
            
            <!-- Quick Stats -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-4">
                <h2 class="text-sm uppercase tracking-widest text-gray-500 font-bold mb-4">Payload Vitals</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gray-850 p-3 rounded-lg border border-gray-700/50">
                        <div class="text-xs text-gray-400 mb-1">Battery</div>
                        <div class="text-xl font-bold text-green-400" id="statBattery">84%</div>
                    </div>
                    <div class="bg-gray-850 p-3 rounded-lg border border-gray-700/50">
                        <div class="text-xs text-gray-400 mb-1">Pi Temp</div>
                        <div class="text-xl font-bold text-yellow-400" id="statTemp">62°C</div>
                    </div>
                    <div class="bg-gray-850 p-3 rounded-lg border border-gray-700/50">
                        <div class="text-xs text-gray-400 mb-1">Satellites</div>
                        <div class="text-xl font-bold text-blue-400" id="statSats">12</div>
                    </div>
                    <div class="bg-gray-850 p-3 rounded-lg border border-gray-700/50">
                        <div class="text-xs text-gray-400 mb-1">CPU Load</div>
                        <div class="text-xl font-bold text-gray-200" id="statCpu">45%</div>
                    </div>
                </div>
            </div>

            <!-- Command Overrides -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-4 flex-1">
                <h2 class="text-sm uppercase tracking-widest text-gray-500 font-bold mb-4">Command Override</h2>
                <div class="space-y-3">
                    <button onclick="sendCommand('ARM_AND_TAKEOFF')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-[0_0_15px_rgba(37,99,235,0.3)]">
                        🚀 Arm & Takeoff (5m)
                    </button>
                    <button onclick="sendCommand('HOLD_POSITION')" class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                        ⏸️ Hold Position
                    </button>
                    <button onclick="sendCommand('RETURN_TO_LAUNCH')" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200 border border-gray-600">
                        🏠 Return to Launch
                    </button>
                    <div class="pt-4 border-t border-gray-800 mt-4">
                        <button onclick="sendCommand('EMERGENCY_KILL')" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 px-4 rounded-lg transition duration-200 shadow-[0_0_20px_rgba(220,38,38,0.4)] uppercase tracking-wider">
                            ☠️ Emergency Kill
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Center Panel: Live Feed & Telemetry -->
        <div class="w-2/4 flex flex-col gap-4 overflow-hidden">
            
            <!-- Video Feed Placeholder -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 flex-1 relative overflow-hidden group">
                <div class="absolute top-4 left-4 z-10 flex items-center space-x-2 bg-black/60 px-3 py-1 rounded-full backdrop-blur-sm">
                    <div class="w-2 h-2 bg-red-500 rounded-full live-dot"></div>
                    <span class="text-xs font-bold text-white tracking-wider">YOLOv8-NANO EDGE FEED</span>
                </div>
                
                <!-- Bounding Box Simulation -->
                <div class="absolute top-[30%] left-[40%] w-[120px] h-[80px] border-2 border-red-500 bg-red-500/20 z-10 hidden" id="simulatedBBox">
                    <div class="bg-red-500 text-white text-[10px] font-bold px-1 absolute -top-4 left-[-2px]">Rust 88%</div>
                </div>

                <!-- Replace src with your actual stream URL later, e.g., http://<pi-ip>:5000/video_feed -->
                <img src="https://images.unsplash.com/photo-1541888087406-8152dbbba407?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Drone View" class="w-full h-full object-cover opacity-60">
                
                <!-- Crosshair overlay -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-30">
                    <div class="w-px h-16 bg-brand-500"></div>
                    <div class="h-px w-16 bg-brand-500 absolute"></div>
                    <div class="w-8 h-8 border border-brand-500 rounded-full absolute"></div>
                </div>
            </div>

            <!-- Telemetry Graph -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-4 h-64 shrink-0">
                <h2 class="text-sm uppercase tracking-widest text-gray-500 font-bold mb-2">Altitude & Speed Analysis</h2>
                <div class="relative h-[180px] w-full">
                    <canvas id="telemetryChart"></canvas>
                </div>
            </div>

        </div>

        <!-- Right Panel: AI Analytics & Logs -->
        <div class="w-1/4 flex flex-col gap-4 overflow-hidden">
            
            <!-- Mission Dashboard -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-4 shrink-0">
                <h2 class="text-sm uppercase tracking-widest text-gray-500 font-bold mb-4">Current Location</h2>
                <div class="bg-gray-850 p-3 rounded-lg border border-gray-700/50 mb-3 flex items-center">
                    <svg class="w-5 h-5 text-gray-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <div>
                        <div class="text-xs text-gray-400">LAT / LON</div>
                        <div class="text-sm font-mono text-white" id="statGps">22.7196° N, 75.8577° E</div>
                    </div>
                </div>
                <div class="flex justify-between items-center text-sm bg-gray-850 p-3 rounded-lg border border-gray-700/50">
                    <span class="text-gray-400">Total Anomalies</span>
                    <span class="font-bold text-brand-500 text-lg" id="anomalyCount">0</span>
                </div>
            </div>

            <!-- AI Detection Log -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-4 flex-1 flex flex-col overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm uppercase tracking-widest text-gray-500 font-bold">AI Anomaly Log</h2>
                    <button onclick="clearLogs()" class="text-xs text-gray-400 hover:text-white underline">Clear</button>
                </div>
                
                <!-- Log Container -->
                <div id="logContainer" class="flex-1 overflow-y-auto space-y-2 pr-2">
                    <!-- Logs injected via JS -->
                </div>

                <button class="mt-4 w-full bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold py-2 px-4 rounded border border-gray-700 transition duration-200 text-sm flex justify-center items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export JSON Report
                </button>
            </div>

        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // --- System Clock ---
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', { hour12: false });
        }, 1000);

        // --- Toast Notification System ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let colorClasses = 'bg-gray-800 border-l-4 border-blue-500 text-white';
            if (type === 'success') colorClasses = 'bg-gray-800 border-l-4 border-green-500 text-white';
            if (type === 'error') colorClasses = 'bg-gray-800 border-l-4 border-red-500 text-white';
            if (type === 'warning') colorClasses = 'bg-gray-800 border-l-4 border-yellow-500 text-white';

            toast.className = `p-4 rounded shadow-lg transition-all duration-300 transform translate-x-full ${colorClasses}`;
            toast.innerHTML = `<p class="font-semibold text-sm tracking-wide">${message}</p>`;
            
            container.appendChild(toast);
            
            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-full');
            });

            // Animate out and remove
            setTimeout(() => {
                toast.classList.add('translate-x-full');
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Command System ---
        function sendCommand(command) {
            // In reality, this would send an AJAX/fetch request to your Pi's Flask server
            console.log(`Sending command: ${command}`);
            
            if (command === 'EMERGENCY_KILL') {
                showToast('CRITICAL: Emergency Kill Activated. Motors stopped.', 'error');
                document.getElementById('connectionStatus').innerText = "Telemetry: LOST";
                document.getElementById('connectionStatus').classList.replace('text-green-400', 'text-red-500');
            } else {
                showToast(`Command Dispatched: ${command}`, 'success');
            }
        }

        // --- Simulated Telemetry & Charting ---
        const ctx = document.getElementById('telemetryChart').getContext('2d');
        const telemetryChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array.from({length: 20}, (_, i) => ''),
                datasets: [
                    {
                        label: 'Altitude (m)',
                        borderColor: '#3b82f6', // Blue
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        data: Array.from({length: 20}, () => 10),
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        borderWidth: 2
                    },
                    {
                        label: 'Speed (m/s)',
                        borderColor: '#10b981', // Green
                        data: Array.from({length: 20}, () => 2),
                        fill: false,
                        tension: 0.4,
                        pointRadius: 0,
                        borderWidth: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: { color: '#9ca3af', boxWidth: 12, font: { size: 10 } }
                    }
                },
                scales: {
                    x: { display: false },
                    y: { 
                        display: true, 
                        grid: { color: '#374151' },
                        ticks: { color: '#9ca3af', font: { size: 10 } }
                    }
                },
                animation: { duration: 0 }
            }
        });

        // Simulate incoming data loop
        let currentAlt = 10.0;
        let currentSpeed = 2.0;
        
        setInterval(() => {
            // Update chart data
            currentAlt += (Math.random() - 0.5) * 0.5;
            currentSpeed += (Math.random() - 0.5) * 0.2;
            
            if (currentAlt < 0) currentAlt = 0;
            if (currentSpeed < 0) currentSpeed = 0;

            const altData = telemetryChart.data.datasets[0].data;
            const spdData = telemetryChart.data.datasets[1].data;
            
            altData.push(currentAlt);
            altData.shift();
            spdData.push(currentSpeed);
            spdData.shift();
            
            telemetryChart.update();

            // Update stats subtly
            if(Math.random() > 0.7) {
                const temp = 60 + Math.floor(Math.random() * 8);
                document.getElementById('statTemp').innerText = `${temp}°C`;
                if(temp > 65) document.getElementById('statTemp').classList.replace('text-yellow-400', 'text-brand-500');
                else document.getElementById('statTemp').classList.replace('text-brand-500', 'text-yellow-400');
            }

        }, 1000);

        // --- AI Anomaly Log Simulation ---
        const anomalies = ['Crack Detected', 'Corrosion', 'Concrete Spalling', 'Exposed Rebar'];
        let totalAnomalies = 0;

        function addLogEntry(type, conf, lat, lon) {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'bg-gray-850 p-3 rounded border-l-4 border-brand-500 text-sm animate-fade-in';
            entry.innerHTML = `
                <div class="flex justify-between items-start mb-1">
                    <span class="font-bold text-white">${type}</span>
                    <span class="bg-brand-500/20 text-brand-500 text-[10px] px-2 py-0.5 rounded font-bold">${conf}%</span>
                </div>
                <div class="text-xs text-gray-400 font-mono">${lat}, ${lon}</div>
                <div class="text-xs text-gray-500 mt-1">${new Date().toLocaleTimeString()}</div>
            `;
            container.prepend(entry);
            
            totalAnomalies++;
            document.getElementById('anomalyCount').innerText = totalAnomalies;
            
            // Keep only last 10 logs
            if (container.children.length > 10) {
                container.removeChild(container.lastChild);
            }
        }

        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '';
            totalAnomalies = 0;
            document.getElementById('anomalyCount').innerText = totalAnomalies;
        }

        // Simulate AI detecting something every few seconds
        setInterval(() => {
            if(Math.random() > 0.7) { // 30% chance every 3 seconds
                const type = anomalies[Math.floor(Math.random() * anomalies.length)];
                const conf = Math.floor(Math.random() * 20) + 80; // 80-99%
                const lat = "22.71" + Math.floor(Math.random() * 99);
                const lon = "75.85" + Math.floor(Math.random() * 99);
                
                addLogEntry(type, conf, `${lat}° N`, `${lon}° E`);
                
                // Flash the simulated bounding box
                const bbox = document.getElementById('simulatedBBox');
                bbox.classList.remove('hidden');
                
                // Randomize bbox position slightly for effect
                bbox.style.top = `${20 + Math.random() * 40}%`;
                bbox.style.left = `${20 + Math.random() * 40}%`;
                bbox.innerHTML = `<div class="bg-red-500 text-white text-[10px] font-bold px-1 absolute -top-4 left-[-2px]">${type} ${conf}%</div>`;

                setTimeout(() => { bbox.classList.add('hidden'); }, 1500);
            }
        }, 3000);

    </script>
</body>
</html>
